{% extends "base.html" %}

{% block title %}Page Not Found (404) — Dynamic Class Track{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="py-5">
        <h1 class="display-1 fw-bold text-primary">404</h1>
        <h2 class="h3 fw-semibold text-dark mb-3">Page Not Found</h2>
        <p class="text-muted mb-4 mx-auto" style="max-width: 500px;">
            The timetable page or resource you are looking for does not exist or has been relocated.
        </p>
        <a href="{{ url_for('main.index') }}" class="btn btn-primary px-4 py-2">
            <i class="fa-solid fa-house me-2"></i> Return to Homepage
        </a>
    </div>
</div>
{% endblock %}
